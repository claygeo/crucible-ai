[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Functions live in src/app/api — Next runtime handles them.
# Cron schedule for crucible jobs runs in Supabase pg_cron, not Netlify.

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
