name: Paper trading snapshot

# Scheduled runs disabled 2026-08-31: the Supabase project behind this pipeline
# was decommissioned, so daily captures can only produce demo-sourced artifacts.
# Manual dispatch is kept for reruns against a future replacement project.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the snapshot without inserting rows."
        required: false
        type: boolean
        default: false
      min_edge:
        description: "Minimum forecast edge for the selected-query row."
        required: false
        type: string
        default: "0.1"

permissions:
  actions: read
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: paper-trading-snapshot
  cancel-in-progress: false

jobs:
  capture:
    name: Capture daily proof rows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_USE_DEMO_DATA: "false"
      SNAPSHOT_MIN_EDGE: ${{ github.event_name == 'workflow_dispatch' && inputs.min_edge || '0.1' }}
      SNAPSHOT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Validate snapshot secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] || {
            printf '::error title=Missing Supabase URL::NEXT_PUBLIC_SUPABASE_URL is required for paper proof capture.\n'
            exit 1
          }

          if [[ "$SNAPSHOT_DRY_RUN" == "true" ]]; then
            echo "Dry run requested; Supabase write secrets are not required."
            echo "SNAPSHOT_EFFECTIVE_DRY_RUN=true" >> "$GITHUB_ENV"
            echo "SNAPSHOT_WRITE_ENABLED=false" >> "$GITHUB_ENV"
            echo "SNAPSHOT_MODE_REASON=manual dry run requested" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            printf '::warning title=Read-only paper proof capture::SUPABASE_SERVICE_ROLE_KEY is not configured, so this run will upload live proof artifacts without writing Supabase snapshot rows.\n'
            echo "SNAPSHOT_EFFECTIVE_DRY_RUN=true" >> "$GITHUB_ENV"
            echo "SNAPSHOT_WRITE_ENABLED=false" >> "$GITHUB_ENV"
            echo "SNAPSHOT_MODE_REASON=missing SUPABASE_SERVICE_ROLE_KEY; read-only artifacts only" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SNAPSHOT_EFFECTIVE_DRY_RUN=false" >> "$GITHUB_ENV"
          echo "SNAPSHOT_WRITE_ENABLED=true" >> "$GITHUB_ENV"
          echo "SNAPSHOT_MODE_REASON=service role secret configured; persisting snapshot rows" >> "$GITHUB_ENV"

      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture paper-trading snapshot
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --json
            --sample live_only
            --agent all
            --category all
            --side all
            --min-edge "$SNAPSHOT_MIN_EDGE"
            --stake-mode kelly_capped
            --ticket-usd 25
            --max-stake-usd 100
            --max-open-exposure-usd 500
            --rows-output paper-snapshot-rows.json
          )

          node -e 'const fs = require("fs"); fs.writeFileSync("paper-snapshot-workflow.json", JSON.stringify({ requested_dry_run: process.env.SNAPSHOT_DRY_RUN === "true", effective_dry_run: process.env.SNAPSHOT_EFFECTIVE_DRY_RUN === "true", write_enabled: process.env.SNAPSHOT_WRITE_ENABLED === "true", mode_reason: process.env.SNAPSHOT_MODE_REASON || "" }, null, 2) + "\n");'

          if [[ "$SNAPSHOT_EFFECTIVE_DRY_RUN" == "true" ]]; then
            npx tsx scripts/paper-trading-snapshot.ts "${args[@]}" \
              | tee paper-snapshot-result.json
          else
            npx tsx scripts/paper-trading-snapshot.ts --write "${args[@]}" \
              | tee paper-snapshot-result.json
          fi

      - name: Run soft proof audit
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/paper-trading-proof-audit.ts --soft --json \
            | tee paper-audit-result.json

      - name: Download retained proof artifact history
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p paper-artifact-history
          downloaded=0

          if ! gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow paper-trading-snapshot.yml \
            --branch main \
            --status success \
            --limit 35 \
            --json databaseId \
            --jq '.[].databaseId' > paper-artifact-history-runs.txt; then
            printf '::warning title=Proof artifact history unavailable::Could not list prior paper proof workflow runs; publishing current capture only.\n'
            exit 0
          fi

          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" != "$GITHUB_RUN_ID" ]] || continue

            target="paper-artifact-history/$run_id"
            mkdir -p "$target"

            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "paper-trading-proof-$run_id" \
              --dir "$target"; then
              downloaded=$((downloaded + 1))
            else
              printf '::notice title=Proof artifact unavailable::Skipping prior paper proof artifact for run %s.\n' "$run_id"
            fi
          done < paper-artifact-history-runs.txt

          echo "Downloaded $downloaded retained proof artifact bundle(s)."

      - name: Run artifact proof rollup
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f paper-snapshot-rows.json ]]; then
            node -e 'const fs = require("fs"); fs.writeFileSync("paper-artifact-audit-result.json", JSON.stringify({ verdict: "blocked", checked_at: new Date().toISOString(), artifact_proof: { status: "unavailable", paper_only: true, real_money_execution_allowed: false }, failed_checks: [{ path: null, code: "artifact_discovery", label: "Artifact discovery", detail: "paper-snapshot-rows.json was not produced." }], exit_code: 1 }, null, 2) + "\n");'
            exit 1
          fi

          audit_args=(
            --file paper-snapshot-rows.json
            --workflow paper-snapshot-workflow.json
            --json
          )

          if find paper-artifact-history -name paper-snapshot-rows.json -type f | grep -q .; then
            audit_args+=(--dir paper-artifact-history)
          fi

          npx tsx scripts/paper-trading-artifact-audit.ts "${audit_args[@]}" \
            | tee paper-artifact-audit-result.json

      - name: Publish latest public proof JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f paper-artifact-audit-result.json ]]; then
            printf '::warning title=Missing artifact audit::paper-artifact-audit-result.json was not produced; skipping public proof publish.\n'
            exit 0
          fi

          npx tsx scripts/paper-trading-publish-artifact-proof.ts \
            --artifact-audit paper-artifact-audit-result.json \
            --workflow paper-snapshot-workflow.json \
            --output public/paper-trading/latest-artifact-proof.json

      - name: Commit latest public proof JSON
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f public/paper-trading/latest-artifact-proof.json ]]; then
            echo "No public proof JSON to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper-trading/latest-artifact-proof.json

          if git diff --cached --quiet; then
            echo "Latest public proof JSON is unchanged."
            exit 0
          fi

          git commit -m "chore: publish latest paper proof"
          git push

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-trading-proof-${{ github.run_id }}
          path: |
            paper-snapshot-workflow.json
            paper-snapshot-result.json
            paper-snapshot-rows.json
            paper-audit-result.json
            paper-artifact-audit-result.json
            public/paper-trading/latest-artifact-proof.json
          if-no-files-found: ignore
          retention-days: 30
